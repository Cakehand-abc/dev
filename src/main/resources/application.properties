# ===================================================================
# 智慧医养守护平台（smart-care）核心配置文件
# ===================================================================

# 应用名称标识
spring.application.name=smart-care

# Web 容器监听地址与端口（支持环境变量重写）
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8084}

# Cookie 与 Session 安全配置
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# MySQL 数据源与连接池配置
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_care?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never

# Jackson JSON 序列化与反序列化
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.deserialization.fail-on-unknown-properties=true

# Flyway 数据库版本迁移管理配置
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# MyBatis-Plus ORM 框架配置（已全面迁移至 mybatis-plus-join，无 XML 依赖）
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.call-setters-on-nulls=true
mybatis-plus.global-config.banner=false

# 业务自定义配置参数
# 系统超级管理员初始密码（启动自动初始化）
app.bootstrap-password=${APP_ADMIN_PASSWORD:12345678Aab?}
# 是否自动植入演示测试数据
app.seed-demo=${APP_SEED_DEMO:false}
# 智能硬件判定在线的心跳有效期阈值（分钟，默认5分钟）
app.online-minutes=5
# 物联网上报时间戳与服务器时间容忍的时钟偏差窗口（秒，默认60秒）
app.clock-skew-seconds=60

# 禁用 Spring MVC 默认的 ProblemDetails 错误格式，保持统一 Api 格式
spring.mvc.problemdetails.enabled=false

