spring.application.name=smart-care
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_care?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:smart_care}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.deserialization.fail-on-unknown-properties=true
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.call-setters-on-nulls=true
mybatis-plus.global-config.banner=false
app.bootstrap-password=${APP_ADMIN_PASSWORD:}
app.seed-demo=${APP_SEED_DEMO:false}
app.online-minutes=5
app.clock-skew-seconds=60
spring.mvc.problemdetails.enabled=false
