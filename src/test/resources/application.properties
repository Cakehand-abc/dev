# Isolated in-memory database for the application-context smoke test.
# Production MySQL SQL and integration tests must be verified separately.
spring.datasource.url=jdbc:h2:mem:smart_care_test;MODE=MySQL;NON_KEYWORDS=VALUE,DAY;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.call-setters-on-nulls=true
mybatis-plus.global-config.banner=false
app.bootstrap-password=TestAdmin!2026
app.seed-demo=false
app.online-minutes=5
app.clock-skew-seconds=60
